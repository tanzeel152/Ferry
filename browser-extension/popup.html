<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OSDM</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="28" height="28" alt="">
    <div class="brand"><strong>OSDM</strong><span>Download Manager</span></div>
    <span id="status" class="pill"><i></i><b>Checking</b></span>
  </header>

  <div id="offline" class="notice" hidden>
    <div>
      <strong>OSDM isn't running</strong>
      <p>Start OSDM from the Start menu, then try again.</p>
    </div>
    <button id="retry" class="secondary">Try again</button>
  </div>

  <main>
    <button id="page" class="primary"></button>
    <div class="section-title"><span>Found on this page</span><span id="count"></span></div>
    <ul id="media"></ul>
  </main>

  <section class="settings">
    <label class="setting">
      <span><b>Catch downloads</b><small>Send downloads of the usual file types to OSDM</small></span>
      <input type="checkbox" id="enabled" class="switch">
    </label>
    <label class="setting">
      <span><b>Button on videos</b><small>Show "Download video" when you point at a video</small></span>
      <input type="checkbox" id="videoButton" class="switch">
    </label>
    <label class="setting">
      <span><b>Port</b><small>Must match Settings &gt; Browser in OSDM</small></span>
      <input type="number" id="port" min="1024" max="65535">
    </label>
  </section>

  <footer>
    <button id="open" class="link"></button>
    <span id="version"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
