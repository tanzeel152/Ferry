# Pushing a tag like v0.5.0 builds the installer, the portable zip and the extension zip, and publishes them
# as a GitHub release with that version's notes from CHANGELOG.md. See "Making a release" in CONTRIBUTING.md.
#
# Code signing: once the SIGNPATH_ORGANIZATION_ID repository variable and the SIGNPATH_API_TOKEN secret are set
# (see "Code signing" in CONTRIBUTING.md), Ferry.exe and the installer are signed through SignPath.
# Without them, the release is built unsigned.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read # lets SignPath read the build's artifacts

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check that the tag matches the version in the code
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $app = (Select-String -Path Ferry\Ferry.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          $extension = (Get-Content browser-extension\manifest.json -Raw | ConvertFrom-Json).version
          if ($app -ne $version -or $extension -ne $version) {
            throw "Tag $version does not match Ferry.csproj ($app) and manifest.json ($extension)."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build Ferry.exe
        run: dotnet publish Ferry\Ferry.csproj -c Release -o publish

      # Sign Ferry.exe before it goes into the installer.
      - name: Upload Ferry.exe for signing
        id: unsigned-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: publish/Ferry.exe

      - name: Sign Ferry.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ferry
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          output-artifact-directory: signed-app

      - name: Use the signed Ferry.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: Copy-Item signed-app\Ferry.exe publish\Ferry.exe -Force

      - name: Build the installer
        run: .\build-installer.ps1 -SkipPublish

      # Sent as "Ferry-Setup.exe", so SignPath's artifact configuration does not change with each version.
      - name: Prepare the installer for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          New-Item -ItemType Directory unsigned-setup | Out-Null
          Copy-Item "dist\Ferry-Setup-$env:VERSION.exe" unsigned-setup\Ferry-Setup.exe

      - name: Upload the installer for signing
        id: unsigned-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: unsigned-setup/Ferry-Setup.exe

      - name: Sign the installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ferry
          signing-policy-slug: release-signing
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          output-artifact-directory: signed-setup

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: Copy-Item signed-setup\Ferry-Setup.exe "dist\Ferry-Setup-$env:VERSION.exe" -Force

      - name: Package
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "dist\Ferry-Setup-$v.exe" release\
          Compress-Archive -Path publish\Ferry.exe, publish\browser-extension -DestinationPath "release\Ferry-$v-portable.zip"
          Compress-Archive -Path browser-extension\* -DestinationPath "release\Ferry-$v-browser-extension.zip"
          Get-ChildItem release | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - name: Take the release notes from CHANGELOG.md
        run: |
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## ') {
              if ($inSection) { break }
              $inSection = $line -match "^## v?$([regex]::Escape($env:VERSION))\b"
              continue
            }
            if ($inSection) { $notes += $line }
          }
          if (-not ($notes -join '').Trim()) { throw "CHANGELOG.md has no notes under '## $env:VERSION'." }
          $notes += ''
          $notes += "**Which file?** Most people want ``Ferry-Setup-$env:VERSION.exe``. See [Download](https://github.com/${{ github.repository }}#download) in the README for the other files and for the Windows SmartScreen warning."
          $notes | Set-Content notes.md -Encoding utf8

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = (Get-ChildItem release).FullName
          # If the release already exists (its tag was moved, or this is a re-run), replace its files and notes.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Ferry $env:VERSION" --notes-file notes.md
          } else {
            gh release create $tag $files --title "Ferry $env:VERSION" --notes-file notes.md
          }
