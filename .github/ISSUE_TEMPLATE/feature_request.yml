name: Feature request
description: Suggest something Ferry should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please [search the existing issues](https://github.com/tanzeel152/Ferry/issues?q=is%3Aissue) first, and add a 👍 to the request if it is already there.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe what you are trying to do and what gets in the way today.
      placeholder: I download large files at night, but I have to leave my PC on and start them by hand.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Ferry help?
      description: Your idea for how it could work. If another download manager does this well, say which one and how.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
